# T9 (D10): build + Vitest + Playwright + Lighthouse CI en cada PR y push a main.
# "ci" es el check que se marca como requerido en la protección de main (T10).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (contenido, i18n)
        run: npm test

      # Los E2E corren sobre contenido de prueba fijo (tests/e2e/fixtures/content).
      - name: Build (contenido de prueba)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      # Lighthouse mide el sitio con el contenido real.
      - name: Build (contenido real)
        run: npm run build

      # Mediana de 3 corridas por URL; falla si alguna categoría baja de 95.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14

  # Con VERCEL_ENV=production ningún campo reservado vacío puede verse como "pendiente".
  production-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sin "pendiente" en producción
        run: npm run e2e -- production
